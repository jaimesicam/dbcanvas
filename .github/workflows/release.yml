# release: on a version tag, build the dbcanvas binary for macOS and Linux on amd64 and arm64,
# sign each file and the checksum list with Sigstore (keyless: the signature says which workflow,
# repository and tag built it, and there is no key to keep), and publish them on the tag's
# GitHub release with the notes from CHANGELOG.md.
#
# The files are dbcanvas-<os>-<arch>, the names the update check looks for (app/updatecheck.go).
# Each is built the way `make dbcanvas` builds one: the web app, the relay forwarders, the
# catalogue and the bundle embedded, CGO off, -trimpath, -ldflags "-s -w -X main.appVersion=<VERSION>".
#
# Verify one:
#
#   cosign verify-blob dbcanvas-linux-amd64 \
#     --bundle dbcanvas-linux-amd64.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/jaimesicam/dbcanvas/\.github/workflows/release\.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#
# Run by hand (Actions → release → Run workflow), it builds and signs a tag — or, with none, the
# branch it runs on at its VERSION — without touching any release, and keeps the files as a
# workflow artifact. Signing writes an entry to Sigstore's public transparency log either way.
#
# The node images are not built here: they are published to ghcr.io with `make publish-images`
# before the tag, for both architectures, because a release binary pulls the ones tagged with
# its own version.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (vX.Y.Z), or empty for this branch; nothing is published"
        required: false

permissions:
  contents: write # create the release and upload its files
  id-token: write # the OIDC token Sigstore signs with

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  dbcanvas:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
      PUBLISH: ${{ github.event_name == 'push' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: version matches the tag
        run: |
          ver="$(cat VERSION)"
          if [ -n "$TAG" ]; then
            [ "v$ver" = "$TAG" ] || { echo "::error::VERSION is $ver but the tag is $TAG"; exit 1; }
          fi
          echo "VERSION=$ver" >>"$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      # What every platform's binary embeds: the same steps `make dbcanvas` runs before go build.
      # The bundle builds Big Hole in a node container, which the runner's Docker provides.
      - name: web app, relay forwarders, catalogue and bundle
        run: |
          set -eu
          (cd app/web && npm ci && npm run build)
          make relaybin catalog bundle

      - name: build
        working-directory: app
        run: |
          set -eu
          mkdir -p ../dist
          for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${p%/*}"; arch="${p#*/}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -buildvcs=false \
              -ldflags="-s -w -X main.appVersion=${VERSION}" -o "../dist/dbcanvas-${os}-${arch}" .
          done
          cd ../dist && sha256sum dbcanvas-* >dbcanvas-checksums.txt && cat dbcanvas-checksums.txt

      - name: the linux/amd64 binary runs and says its version
        run: |
          got="$(dist/dbcanvas-linux-amd64 version)"
          echo "$got"
          [ "$got" = "dbcanvas $VERSION" ] || { echo "::error::expected 'dbcanvas $VERSION'"; exit 1; }

      - uses: sigstore/cosign-installer@v3

      - name: sign
        working-directory: dist
        run: |
          set -eu
          for f in dbcanvas-*; do
            case "$f" in *.sigstore.json) continue ;; esac
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" >/dev/null
          done
          ls -l

      - name: check a signature
        working-directory: dist
        run: |
          cosign verify-blob dbcanvas-checksums.txt \
            --bundle dbcanvas-checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_WORKFLOW_REF#*@}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: keep the files (run by hand)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: dbcanvas-${{ env.TAG || format('{0}-test', github.ref_name) }}
          path: dist/

      - name: publish
        if: env.PUBLISH == 'true'
        run: |
          set -eu
          bash scripts/release.sh notes "$VERSION" >notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "DBCanvas $VERSION" --notes-file notes.md
          else
            gh release create "$TAG" --title "DBCanvas $VERSION" --notes-file notes.md --verify-tag
          fi
          # The binaries first, so they head the release's file list.
          gh release upload "$TAG" dist/dbcanvas-linux-amd64 dist/dbcanvas-linux-arm64 \
            dist/dbcanvas-darwin-amd64 dist/dbcanvas-darwin-arm64 --clobber
          gh release upload "$TAG" dist/* --clobber
